#cloud-config
hostname: client
network: {config: disabled}
users:
  - name: student
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - __SSH_KEY__
    lock_passwd: false
chpasswd:
  expire: false
  list: |
    student:debugpass
ssh_pwauth: true
disable_root: true
package_update: false
package_upgrade: false
bootcmd:
  - systemctl mask systemd-networkd-wait-online.service systemd-networkd-wait-online@.service || true
runcmd:
  - ip link set ens3 up
  - ip addr add __IP__/29 dev ens3
  - ip route add default via __GW__ || true
  - ip -4 a > /tmp/net-setup.log 2>&1
  - ip route >> /tmp/net-setup.log 2>&1
