# /etc/nginx/conf.d/opla-l7.conf — включается в http{} стандартного Debian nginx.
# Ограничение по реальному адресу TCP-клиента. Заголовку X-Forwarded-For не доверяем.
limit_req_zone $binary_remote_addr zone=opla_per_ip:1m rate=5r/s;
limit_req zone=opla_per_ip burst=10 nodelay;
limit_req_status 429;
limit_req_log_level notice;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
client_max_body_size 1m;

log_format opla_security escape=json
    '{"time":"$time_iso8601","src":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"limit_req":"$limit_req_status"}';
# Второй журнал сохраняет стандартный access.log для существующей методички.
access_log /var/log/nginx/opla-security.jsonl opla_security;
