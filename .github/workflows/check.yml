name: Security lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install portable dependencies
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends gcc libc6-dev linux-libc-dev make python3 python3-yaml qemu-utils
      - name: Run portable checks
        shell: bash
        run: |
          mkdir -p reports/ci
          set -o pipefail
          make check 2>&1 | tee reports/ci/check.log
      - name: Preserve check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-log
          path: reports/ci/check.log
          retention-days: 14
  configuration:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install configuration validators
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends python3 python3-yaml suricata ansible-core
      - name: Validate Suricata and Ansible
        run: |
          suricata -V
          python3 tools/check-suricata.py
          python3 tools/check-docs.py
          ansible-playbook -i ansible/inventory.example.ini ansible/site.yml --syntax-check
          ansible-playbook -i ansible/inventory.lab-local.example.ini ansible/lab-host.yml --syntax-check
          ansible-playbook -i ansible/inventory.local.example.ini ansible/preflight.yml --syntax-check
  bpf-build:
    needs: [portable, configuration]
    runs-on: ubuntu-24.04
    container: debian:12-slim
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF toolchain
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends clang gcc make libbpf-dev linux-libc-dev llvm
      - name: Compile and package
        shell: bash
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          make -C xdp clean
          make -C xdp THRESHOLD=100 MAX_SOURCES=4096
          llvm-objdump -h xdp/xdp_ddos_protect.o
          mkdir -p dist
          cp xdp/xdp_ddos_protect.o dist/
          clang --version > dist/compiler.txt
          dpkg-query -W clang libbpf-dev linux-libc-dev > dist/packages.txt
          sha256sum dist/xdp_ddos_protect.o > dist/SHA256SUMS
          bash ci/package.sh
      - name: Upload BPF package
        uses: actions/upload-artifact@v4
        with:
          name: opla-bpf-${{ github.sha }}
          path: |
            dist/opla-bpf-*.tar.gz
            dist/delivery.sha256
          if-no-files-found: error
          retention-days: 30
