name: Portable and BPF checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install portable dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make python3-yaml
      - name: Run portable checks
        run: make check
  bpf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make libbpf-dev linux-libc-dev
      - name: Build BPF object
        run: make -C xdp THRESHOLD=100
