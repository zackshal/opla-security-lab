<text x="700.0" y="82.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">IPv4 / IHL / total</text>
<text x="700.0" y="113.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">TCP-фрагменты: DROP</text>
<rect x="1000" y="40" width="360" height="100" rx="10" fill="#eef4fa" stroke="#334155" stroke-width="2"/>
<text x="1180.0" y="82.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">TCP / doff / длина</text>
<text x="1180.0" y="113.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">Безопасные обращения</text>
