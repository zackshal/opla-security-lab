<text x="700.0" y="292.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">SYN=1, ACK=0?</text>
<text x="700.0" y="323.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">Прочий трафик: PASS</text>
<rect x="440" y="450" width="520" height="120" rx="10" fill="#eef4fa" stroke="#334155" stroke-width="2"/>
<text x="700.0" y="502.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">Окно source IP + spin lock</text>
<text x="700.0" y="533.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">count++; порог THRESHOLD</text>
<rect x="40" y="660" width="360" height="100" rx="10" fill="#eef4fa" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="702.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">count ≤ THRESHOLD</text>
<text x="220.0" y="733.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#172b45">PASS + счётчик</text>
