<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">OPLA packet decision path</title><desc id="desc">An IPv4 TCP SYN is classified, checked against a source window and passed or dropped.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161a29"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4ad9d0"/></marker></defs>
<rect width="1000" height="360" rx="20" fill="#090a10"/><rect width="1000" height="360" rx="20" fill="url(#grid)"/><rect width="1000" height="7" rx="3" fill="#4ad9d0"/>
<g font-family="monospace"><text x="42" y="48" font-size="16" fill="#4ad9d0">OPLA // PACKET PATH / 03</text><text x="760" y="48" font-size="14" fill="#a7a5bc">XDP / DECISION TRACE</text>
<g fill="#11131d" stroke="#303653"><rect x="42" y="120" width="194" height="96" rx="14"/><rect x="282" y="120" width="194" height="96" rx="14"/><rect x="522" y="120" width="194" height="96" rx="14"/><rect x="762" y="120" width="196" height="96" rx="14"/></g>
<g fill="#f3f2ff" text-anchor="middle"><text x="139" y="158" font-size="18" font-weight="700">ETH / IPv4</text><text x="139" y="188" font-size="13" fill="#a7a5bc">frame boundary</text><text x="379" y="158" font-size="18" font-weight="700">TCP SYN</text><text x="379" y="188" font-size="13" fill="#a7a5bc">new flow only</text><text x="619" y="158" font-size="18" font-weight="700">source window</text><text x="619" y="188" font-size="13" fill="#a7a5bc">bounded LRU state</text><text x="860" y="158" font-size="18" font-weight="700">PASS / DROP</text><text x="860" y="188" font-size="13" fill="#a7a5bc">counter + evidence</text></g>
<path d="M236 168H274M476 168H514M716 168H754" stroke="#4ad9d0" stroke-width="3" marker-end="url(#arrow)"/>
<text x="42" y="290" font-size="15" fill="#ff5a0a">scope: new IPv4 TCP SYN only · trusted sources bypass scan policy only</text></g>
</svg>
