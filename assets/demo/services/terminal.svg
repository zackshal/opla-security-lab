<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="775" viewBox="0 0 1000 775" role="img" aria-labelledby="title desc">
<title id="title">OPLA local service demo</title><desc id="desc">Recorded CLI output with synthetic evidence; no virtual machine operations.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#161a29"/></pattern></defs>
<rect width="1000" height="775" fill="#090a10"/><rect width="1000" height="775" fill="url(#grid)"/><rect x="24" y="24" width="952" height="727" rx="16" fill="#11131d" stroke="#303653"/><rect x="24" y="24" width="952" height="6" rx="3" fill="#4ad9d0"/>
<g font-family="monospace"><text x="52" y="68" font-size="18" font-weight="700" fill="#f3f2ff">OPLA // SERVICE REPLAY</text><text x="52" y="91" font-size="13" fill="#a7a5bc">synthetic evidence / local process boundary / no VM operations</text>
<text x="52" y="135" fill="#4ad9d0">$ python3 bin/opla-cli.py --help</text><text x="52" y="156" fill="#f3f2ff">CLI help: lab, vm, deploy, xdp, ids, scenario, report, monitoring, system</text>
<text x="52" y="198" fill="#4ad9d0">$ python3 bin/opla-cli.py system services</text><text x="52" y="219" fill="#f3f2ff">opla-control: NOT_STARTED</text><text x="52" y="240" fill="#f3f2ff">opla-evidence: NOT_STARTED</text><text x="52" y="261" fill="#f3f2ff">opla-guest-agent: NOT_STARTED</text><text x="52" y="282" fill="#f3f2ff">opla-host-backend: NOT_STARTED</text><text x="52" y="303" fill="#f3f2ff">opla-monitoring: NOT_STARTED</text>
<text x="52" y="345" fill="#4ad9d0">$ python3 bin/opla-cli.py system services</text><text x="52" y="366" fill="#f3f2ff">opla-control: NOT_STARTED</text><text x="52" y="387" fill="#10b83c">opla-evidence: RESPONDING</text><text x="52" y="408" fill="#f3f2ff">opla-guest-agent: NOT_STARTED</text><text x="52" y="429" fill="#f3f2ff">opla-host-backend: NOT_STARTED</text><text x="52" y="450" fill="#f3f2ff">opla-monitoring: NOT_STARTED</text>
<text x="52" y="492" fill="#4ad9d0">$ python3 bin/opla-cli.py report incident &lt;experiment&gt; --via-service --lab lab-DEMO</text><text x="52" y="513" fill="#f3f2ff">SYN delta: 50</text><text x="52" y="534" fill="#ff5a0a">Suricata: unavailable</text><text x="52" y="555" fill="#ff1825">Complete evidence verified: False</text>
<text x="52" y="597" fill="#4ad9d0">$ python3 bin/opla-cli.py report incident &lt;experiment&gt; --via-service --lab lab-OTHER</text><text x="52" y="618" fill="#ff1825">OPLA: service blocked request / inspect operation evidence before retry</text><text x="52" y="639" fill="#ff1825">exit code: 2</text>
<text x="52" y="702" fill="#a7a5bc">ARCHIVE / actual local process recording / synthetic evidence</text><text x="52" y="723" fill="#a7a5bc">The synthetic lab-DEMO is not a created laboratory.</text></g>
</svg>
