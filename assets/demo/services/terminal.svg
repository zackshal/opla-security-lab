<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="775" viewBox="0 0 1000 775"><title>OPLA actual local service demo with synthetic evidence</title><rect width="100%" height="100%" fill="#0f172a"/><g font-family="monospace" font-size="13"><text x="20" y="30" fill="#e2e8f0">OPLA: recorded service demo / synthetic evidence / no VM operations</text><text x="20" y="51" fill="#e2e8f0"></text><text x="20" y="72" fill="#86efac">$ python3 bin/opla-cli.py --help</text><text x="20" y="93" fill="#e2e8f0">CLI help: lab, vm, deploy, xdp, ids, scenario, report, monitoring, system</text><text x="20" y="114" fill="#e2e8f0"></text><text x="20" y="135" fill="#86efac">$ python3 bin/opla-cli.py system services</text><text x="20" y="156" fill="#e2e8f0">opla-control: NOT_STARTED</text><text x="20" y="177" fill="#e2e8f0">opla-evidence: NOT_STARTED</text><text x="20" y="198" fill="#e2e8f0">opla-guest-agent: NOT_STARTED</text><text x="20" y="219" fill="#e2e8f0">opla-host-backend: NOT_STARTED</text><text x="20" y="240" fill="#e2e8f0">opla-monitoring: NOT_STARTED</text><text x="20" y="261" fill="#e2e8f0"></text><text x="20" y="282" fill="#86efac">$ python3 bin/opla-cli.py system services</text><text x="20" y="303" fill="#e2e8f0">opla-control: NOT_STARTED</text><text x="20" y="324" fill="#e2e8f0">opla-evidence: RESPONDING</text><text x="20" y="345" fill="#e2e8f0">opla-guest-agent: NOT_STARTED</text><text x="20" y="366" fill="#e2e8f0">opla-host-backend: NOT_STARTED</text><text x="20" y="387" fill="#e2e8f0">opla-monitoring: NOT_STARTED</text><text x="20" y="408" fill="#e2e8f0"></text><text x="20" y="429" fill="#86efac">$ python3 bin/opla-cli.py report incident &lt;experiment&gt; --via-service --lab lab-DEMO</text><text x="20" y="450" fill="#e2e8f0">SYN delta: 50</text><text x="20" y="471" fill="#e2e8f0">Suricata: unavailable</text><text x="20" y="492" fill="#e2e8f0">Complete evidence verified: False</text><text x="20" y="513" fill="#e2e8f0"></text><text x="20" y="534" fill="#86efac">$ python3 bin/opla-cli.py report incident &lt;experiment&gt; --via-service --lab lab-OTHER</text><text x="20" y="555" fill="#e2e8f0">OPLA: ошибка запуска: service blocked request; inspect operation evidence before retry</text><text x="20" y="576" fill="#e2e8f0">exit code: 2</text><text x="20" y="597" fill="#e2e8f0"></text><text x="20" y="618" fill="#86efac">$ python3 bin/opla-cli.py system services</text><text x="20" y="639" fill="#e2e8f0">opla-control: NOT_STARTED</text><text x="20" y="660" fill="#e2e8f0">opla-evidence: NOT_STARTED</text><text x="20" y="681" fill="#e2e8f0">opla-guest-agent: NOT_STARTED</text><text x="20" y="702" fill="#e2e8f0">opla-host-backend: NOT_STARTED</text><text x="20" y="723" fill="#e2e8f0">opla-monitoring: NOT_STARTED</text><text x="20" y="744" fill="#e2e8f0"></text></g></svg>
