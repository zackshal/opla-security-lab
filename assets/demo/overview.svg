<rect width="1080" height="660" rx="20" fill="#090a10"/><rect width="1080" height="660" rx="20" fill="url(#grid)"/><rect width="1080" height="7" rx="3" fill="#4ad9d0"/>
<g font-family="monospace"><text x="40" y="42" font-size="15" fill="#4ad9d0">OPLA // SECURITY LAB</text><text x="820" y="42" font-size="14" fill="#a7a5bc">OFFLINE / ARCHIVE</text><text x="40" y="92" font-family="sans-serif" font-size="34" font-weight="700" fill="#f3f2ff">Три роли. Две сети. Один опыт.</text><text x="40" y="124" font-family="sans-serif" font-size="16" fill="#a7a5bc">Сохранённый операторский вывод / числа не являются live-приёмкой</text>
<g fill="#11131d" stroke="#303653"><rect x="40" y="164" width="310" height="102" rx="14"/><rect x="385" y="164" width="310" height="102" rx="14"/><rect x="730" y="164" width="310" height="102" rx="14"/></g><g fill="#f3f2ff"><text x="64" y="202" font-size="22" font-weight="700">ATTACKER</text><text x="64" y="235" font-size="14" fill="#a7a5bc">bounded data traffic</text><text x="409" y="202" font-size="22" font-weight="700">VICTIM</text><text x="409" y="235" font-size="14" fill="#a7a5bc">XDP / Suricata / nginx</text><text x="754" y="202" font-size="22" font-weight="700">CLIENT</text><text x="754" y="235" font-size="14" fill="#a7a5bc">independent HTTP probe</text></g>
<rect x="40" y="300" width="1000" height="76" rx="14" fill="url(#accent)" stroke="#303653"/><text x="66" y="332" font-size="15" fill="#ff5a0a">DATA NETWORK / isolated /29</text><text x="66" y="358" font-size="15" fill="#a7a5bc">management bridge stays separate: SSH → collector → report</text>
<rect x="40" y="412" width="1000" height="164" rx="14" fill="#11131d" stroke="#303653"/><text x="66" y="448" font-size="15" fill="#6d38ff">$ archived-observation --summarize</text><text x="66" y="484" font-size="19" fill="#f3f2ff">syn delta     2,003</text><text x="66" y="516" font-size="19" fill="#10b83c">pass delta      300</text><text x="66" y="548" font-size="19" fill="#ff5a0a">drop delta    1,703</text><text x="440" y="484" font-size="19" fill="#f3f2ff">http 200       11</text><text x="440" y="516" font-size="19" fill="#ff5a0a">http 429      189</text><text x="440" y="548" font-size="19" fill="#ff1825">client continuity: NOT ATTACHED</text><text x="66" y="626" font-size="13" fill="#a7a5bc">ARCHIVE / OPERATOR OUTPUT / 24.10.2026 / ARCHIVED OUTPUT</text></g>
