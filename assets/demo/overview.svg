<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">OPLA OPLA archive</title><desc id="desc">A dark terminal-style summary of the three-role lab and archived SYN and HTTP observations.</desc>
