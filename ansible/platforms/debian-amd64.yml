---
opla_platform_id: debian-amd64

opla_platform:
  os_family: Debian
  distributions:
    - Debian
  versions:
    - "12"
    - "13"
  architectures:
    - x86_64
  package_manager: apt
  execution_backend: qemu-kvm
  ebpf_supported: true

opla_platform_packages:
  - qemu-system-x86
  - qemu-utils
  - cloud-image-utils
  - dnsmasq-base
  - iproute2
  - nftables
  - libguestfs-tools
  - socat
  - openssh-client
  - curl
  - ca-certificates
  - python3
  - python3-yaml
  - git
