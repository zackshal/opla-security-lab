workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages: [test, build, package, live-acceptance, deploy]

default:
  image: debian:13-slim
  interruptible: true
  timeout: 20m

variables:
  DEBIAN_FRONTEND: noninteractive
  FF_USE_DIRECT_DOWNLOAD: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

portable:
  stage: test
  before_script:
    - set -o pipefail
    - apt-get update -qq
    - "apt-get install -y -qq --no-install-recommends gcc libc6-dev linux-libc-dev make python3 python3-yaml qemu-utils 2>&1 | sed '/^W: Tried to start delayed item/d'"
  script:
    - mkdir -p reports/ci
    - bash -o pipefail -c 'make check 2>&1 | tee reports/ci/check.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/ci/check.log]

configuration:
  stage: test
  before_script:
    - set -o pipefail
    - apt-get update -qq
    - "apt-get install -y -qq --no-install-recommends python3 python3-yaml suricata ansible-core 2>&1 | sed '/^W: Tried to start delayed item/d'"
  script:
    - suricata -V
    - python3 tools/check-suricata.py
    - ansible-playbook -i ansible/inventory.example.ini ansible/site.yml --syntax-check
    - ansible-playbook -i ansible/inventory.lab-local.example.ini ansible/lab-host.yml --syntax-check
    - ansible-playbook -i ansible/inventory.local.example.ini ansible/preflight.yml --syntax-check

bpf-build:
  stage: build
  dependencies: []
  image: debian:12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang gcc make libbpf-dev linux-libc-dev llvm
  script:
    - make -C xdp clean
    - make -C xdp THRESHOLD=100 MAX_SOURCES=4096
    - llvm-objdump -h xdp/xdp_ddos_protect.o
    - mkdir -p dist
    - cp xdp/xdp_ddos_protect.o dist/
    - clang --version > dist/compiler.txt
    - dpkg-query -W clang libbpf-dev linux-libc-dev > dist/packages.txt
    - sha256sum dist/xdp_ddos_protect.o > dist/SHA256SUMS
  artifacts:
    expire_in: 30 days
    paths: [dist/xdp_ddos_protect.o, dist/compiler.txt, dist/packages.txt, dist/SHA256SUMS]

delivery:
  stage: package
  needs:
    - job: bpf-build
      artifacts: true
  script:
    - bash ci/package.sh
  artifacts:
    name: 'opla-bpf-$CI_COMMIT_SHORT_SHA'
    expire_in: 30 days
    paths: [dist/opla-bpf-*.tar.gz, dist/delivery.sha256]

live_acceptance:
  stage: live-acceptance
  tags: [opla-live-runner]
  when: manual
  interruptible: false
  timeout: 2h
  resource_group: opla-live
  environment:
    name: live-lab
    action: prepare
  needs:
    - job: portable
    - job: configuration
    - job: bpf-build
      artifacts: false
  variables:
    OPLA_SCENARIO: syn-scan-baseline
    OPLA_SKIP_RECOVERY: "0"
    OPLA_LAB_PREFIX: "live"
    OPLA_KEEP_LAB: "0"
    # OPLA_ZABBIX_USER / OPLA_ZABBIX_PASSWORD — masked CI variables.
  script:
    - chmod +x ci/live/run-live-acceptance.sh ci/live/cleanup-stale-labs.sh ci/live/lib/*.sh
    - bash ci/live/run-live-acceptance.sh
    - |
      set -e
      VERIFICATION="live-acceptance-output/verification.json"
      if [ ! -f "$VERIFICATION" ]; then
        echo "ERROR: $VERIFICATION not produced"; exit 1
      fi
      STATUS="$(python3 -c 'import json;print(json.load(open("'"$VERIFICATION"'"))["overall_status"])')"
      echo "live-acceptance overall_status=$STATUS"
      cat "$VERIFICATION"
      [ "$STATUS" = "PASS" ]
  artifacts:
    when: always
    name: "opla-live-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 year
    paths:
      - live-acceptance-output/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never

deploy-staging:
  stage: deploy
  interruptible: false
  tags: [opla-deploy]
  resource_group: opla-staging
  environment:
    name: staging
  needs:
    - job: bpf-build
      artifacts: true
    - job: delivery
      artifacts: false
  rules:
    - if: '$OPLA_DEPLOY_ENABLED == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - set -o pipefail
    - apt-get update -qq
    - "apt-get install -y -qq --no-install-recommends ansible-core openssh-client ca-certificates 2>&1 | sed '/^W: Tried to start delayed item/d'"
  script:
    - bash ci/deploy.sh
